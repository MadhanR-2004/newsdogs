services:
  - type: web
    name: news-watchdog
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python watchdog.py
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: SCHEDULE_INTERVAL_MINUTES
        value: "120"
      - key: ALERT_INTERVAL_MINUTES
        value: "15"
      - key: MAX_ARTICLES_PER_RUN
        value: "270"
      - key: TRIAGE_PICK_TOP
        value: "6"
      - key: CONFIDENCE_ALERT_THRESHOLD
        value: "40"
      - key: CREWAI_TELEMETRY_OPT_OUT
        value: "true"
      - key: OTEL_SDK_DISABLED
        value: "true"
